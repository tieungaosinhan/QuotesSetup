<body>
<div id="loadingLayer">
	Loading...
</div>
<div class="container">
	<div class="sidebar">
		<div></div>
		<div class="active"></div>
	</div>
	<div class = "suggestbox">
		<div id="cardbox"></div>

</div>

<script src="emplate.js"></script>
<script type="module">
	const myCollection = `QuoteSet`; // tên collection trong Firestore AppProject || QuoteSet
	let oQ = {}, nQ = {}, Tags = {}, Card = {}, CardInfo = {}, recObj = {}; // Object
	let Old = [], New = [], CardName = [], TagArr = [], FinalArr = []; //Array
	let Qi, ZeroCount; //number
//get data from Firestore
	async function getData(myCollection, myDoc) {
		const Collection = db.collection(myCollection); // truy cập collection
		const Doc = Collection.doc(myDoc); // truy cập document
	
	// Gọi Firestore		
		const docSnap = await Doc.get();
		const check = docSnap.data();
		if (docSnap.exists) {
			 return check;
		} else {
			//await Doc.set();
			return null;
		}
	}
	oQ = await getData(myCollection, `Old`);
	Old = oQ.Quotes;
	nQ = await getData(myCollection, `Quotes`); 
	New = nQ.Quotes;
	Tags = await getData(myCollection, `Tags`); //Tags
	CardInfo = await getData(myCollection, `CardInfo`);
	Object.keys(CardInfo).forEach(key => { //Setup CardName, CardTag
		CardName.push(key);
		Card[key] = [...new Set(Object.values(CardInfo[key].tags).flat())];
	});
	

function setRecObj() {	
	CardName.forEach(c => {
		recObj[c] = 0;
	});
	New.forEach(q => {
		q.Card.forEach(t => {
			if (recObj.hasOwnProperty(t)) {
				recObj[t] += 1;
			}
		});
	});
	ZeroCount = Object.values(recObj).filter(v => v === 0).length;
}	
function firstUI(){	
	setRecObj();
	Qi = Math.floor(Math.random() * Old.length);	
	document.getElementById("btncount").innerHTML = `0/${CardName.length}`;
	
	document.getElementById("count").innerHTML = `Được <span style="color:brown; font-weight:bold;">${New.length}</span> quotes rồi. Còn <span style="color:brown; font-weight:bold;">${Old.length}</span> nữa thôi. Chaiyoooo`;
	document.getElementById("Q").innerHTML = `${Old[Qi].quotes}<br><span>${Old[Qi].author}</span>`;
	document.getElementById("Question").innerHTML = ``;

	const fragment = document.createDocumentFragment();
	
	Object.keys(Tags).forEach(tag => {
		const div = document.createElement("div");
		div.className = "keytag";
		div.id = tag;
		div.textContent = `${Tags[tag].description}`;
		fragment.appendChild(div);
	});
	document.getElementById("Question").appendChild(fragment);
	document.getElementById("meaning").value = ``;
	setupkeytag();
	Activecolor(`.resultbox > *`,1);
	Activecolor(`.keytag`,0.3);
}
function renderCard(arr) {
	document.getElementById("cardbox").innerHTML = ``;
	const fragment = document.createDocumentFragment();
	arr.sort().forEach(k => {
		const div = document.createElement("div");
 		div.id = k;
		div.className = "tag";
		div.textContent = `${CardInfo[k].cardname}`;
		div.title = `Count: ${recObj[k]}`;
		div.title += `, Up: `;
		CardInfo[k].tags.upright.forEach(i => {
			div.title += ` #${i}`;
		});
		div.title += `, Rv: `;
		CardInfo[k].tags.reversed.forEach(i => {
			div.title += ` #${i}`;
		});
		fragment.appendChild(div);
	});
	document.getElementById("cardbox").appendChild(fragment);	
	Activecolor(`.tag`,0.5);
	document.querySelector("#cardbox").addEventListener("click", e => {
		// chỉ xử lý khi click trúng phần tử con có class "tag"
		let el = e.target;
		if (el.classList.contains("tag")) {
			const tid = el.id;
			const tempElements = document.querySelectorAll(".keytag");
			tempElements.forEach(e => {
				let i = e.id;
				// Nếu id chưa từng xuất hiện trong arr thì thêm class .temp
				if (CardInfo[tid].core.includes(i)) {
					e.classList.add("temp");
					setTimeout(() => e.classList.remove("temp"), 10000);
				}
			});
		};
	});
	let html = (arr.length === CardName.length) ? `0/${CardName.length}` : `${arr.length}/${CardName.length}`;
	document.getElementById("btncount").innerHTML = `${html}`;
};

function reload() {
	firstUI();
	renderCard(CardName);
	document.getElementById("relatetag").innerHTML = ``;	
	TagArr = [];
	FinalArr = [];
	document.getElementById("loadingLayer").classList.add("none");	
}
reload();

function createblock(Author, En, Vi, Card){
	return {
		Author,
		En,
		Vi,
		Card
	}
};

document.getElementById("add").onclick = () => {
	document.getElementById("del").classList.add("none");
	document.getElementById("Q").innerHTML = `<textarea placeholder="Nhập quote mới"></textarea><br><span><input placeholder="Tên tác giả"><button class="quoteAdd">OK</button></span>`;
};
	
Activecolor(`.sidebar`,0.5);

document.querySelector(".sidebar").addEventListener("click", e => {
	document.querySelector(".sidebar").classList.toggle("active");
	document.querySelector(".container").classList.toggle("push");
});

document.querySelector("#Q").addEventListener("click", e => {
	// chỉ xử lý khi click trúng phần tử con có class "quoteAdd"
	if (e.target.classList.contains("quoteAdd")) {
		document.getElementById("loadingLayer").classList.remove("none");	
		let tempq = document.querySelector("#Q textarea").value;
		let tempa = document.querySelector("#Q input").value;
		if (tempq === "" || tempa === "") {
			alert("Null")
			return;
		};
		function makeAddBlock(quotes, author) {
			// Tạo object block
			return {
				quotes,
				author
			};
		}	
		let tempblock = makeAddBlock(tempq,tempa);
		Qi = Old.length;
		Old.push(tempblock);
		document.getElementById("count").innerHTML = `Còn <span style="color:brown; font-weight:bold;">${Old.length}</span> quotes nữa thôi nè =)) Chaiyoooo`;
		document.getElementById("Q").innerHTML = `${Old[Qi].quotes}<br><span>${Old[Qi].author}</span>`;
		document.getElementById("del").classList.remove("none");
		document.getElementById("loadingLayer").classList.add("none");	
	}
});		

function compareCard() {
	Object.keys(Card).forEach(card => {
		if (TagArr.every(el => Card[card].includes(el))) {
			if (!FinalArr.includes(card)) {
				FinalArr.push(card);
			}
		};			
	});
	if (TagArr === []){
		renderCard(CardName)
	} else renderCard(FinalArr);
};

function setupkeytag() {
	document.querySelectorAll(".keytag").forEach(btn => {
		btn.addEventListener("click", e => {
			let ac = document.querySelectorAll(".keytag.active").length;
			let el = e.target;
			let id = el.id;
			if (el.classList.contains("active")) {
				el.classList.remove("active");
				const removable = document.querySelectorAll(".tag");
				removable.forEach(e => {
					if (e.classList.contains(`${id}`)) {
						let tid = e.id;
						FinalArr = [];
						TagArr = TagArr.filter(item => item !== tid);
						compareCard();
						e.remove();
					}
				});
			} else{
				if (ac >1) {
					alert("2 thôi");
					return;
				};
				el.classList.add("active");
				const fragment = document.createDocumentFragment();
				Object.keys(Tags[id].tags).forEach(k => {
					const div = document.createElement("div");
					div.className = `tag ${id}`;
					div.id = k;
					div.textContent = `${Tags[id].tags[k]}`;
					div.title = k;
					fragment.appendChild(div);
				});
				document.getElementById("relatetag").appendChild(fragment);	
				Activecolor(`#relatetag .tag`,0.5);
			};
		});
			
		Activecolor(`.tag`,0.5);
	});
}
document.querySelector("#relatetag").addEventListener("click", e => {
	// chỉ xử lý khi click trúng phần tử con có class "tag"
	let el = e.target;
	if (el.classList.contains("tag")) {
		FinalArr = [];
		let ac = document.querySelectorAll("#relatetag .active").length;
		let id = el.id;
		if (el.classList.contains("active")) {
			el.classList.remove("active");
			const index = TagArr.indexOf(id);
			if (index !== -1) {
				TagArr.splice(index, 1); // xoá phần tử tại vị trí index
			}
			if (index === -1) {
				TagArr = []; // xoá phần tử tại vị trí index
			}
			Object.keys(Card).forEach(card => {
				if (TagArr.every(el => Card[card].includes(el))) {
					if (!FinalArr.includes(card)) {
						const idx = FinalArr.indexOf(card)
						if (idx !== -1) {
							FinalArr.splice(idx, 1); // xoá phần tử tại vị trí index
						}
					}
				};			
			});
		} else{
			if (ac > 2) {
				alert("3 thôi");
				return;
			};
			el.classList.add("active");
			TagArr.push(id);
		};
		
		document.getElementById("cardbox").innerHTML = ``;
		compareCard();
		const temp = document.querySelectorAll("#cardbox .tag");
		temp.forEach(t => {
			t.classList.add("active");
		});
	}
});		
document.getElementById("apply").addEventListener("click", async () => {
	document.getElementById("loadingLayer").classList.remove("none");	
	const Author = Old[Qi].author;
	const En = Old[Qi].quotes;
	const Vi = document.getElementById("meaning").value;
	if (Vi === `` || FinalArr.length === 0) {
		alert("Điền cho hết");
		document.getElementById("loadingLayer").classList.add("none");	
		return;
	}
	New.push(createblock(Author, En, Vi, FinalArr));
	Old.splice(Qi,1);
//Code chung	
	const Collection = db.collection(myCollection); // truy cập collection
	const oldDoc = Collection.doc(`Old`); // truy cập document
	const olddocSnap = await oldDoc.get();
	
	await oldDoc.set({Quotes: Old}); // Chỉ update key cần thiết - Doc.update(data) nếu là object
	alert("Upload Old, Done.");
	const newDoc = Collection.doc(`Quotes`); // truy cập document
	const newdocSnap = await newDoc.get();
	
	await newDoc.set({Quotes: New}); // Chỉ update key cần thiết - Doc.update(data) nếu là object
	alert("Upload New, Done.");
	
	const newSnap = await newDoc.get();
	const d = newSnap.data();
	const oldSnap = await oldDoc.get();
	const f = oldSnap.data();
	const TransCollection = db.collection(`AppProject`); // truy cập collection
	const TransDoc = TransCollection.doc(`Quotes`); // truy cập document
	const TransdocSnap = await TransDoc.get();
	
	await TransDoc.set({Quotes: New}); // Chỉ update key cần thiết - Doc.update(data) nếu là object
	alert("Trans, Done.");
	reload();
});

document.getElementById("del").addEventListener("click", async () => {
	document.getElementById("loadingLayer").classList.remove("none");
	Old.splice(Qi,1);
	//Code chung	
	const Collection = db.collection(myCollection); // truy cập collection
	const oldDoc = Collection.doc(`Old`); // truy cập document
	const olddocSnap = await oldDoc.get();
	await oldDoc.set({Quotes: Old}); // Chỉ update key cần thiết - Doc.update(data) nếu là object
	alert("Removed");
	reload();
});

document.querySelector("#reload").addEventListener("click", e => {
	document.getElementById("loadingLayer").classList.remove("none");	
	reload();
});

async function downloadDoc(myCollection, myDoc, fieldName) {
  try {
    const docRef = db.collection(myCollection).doc(myDoc);
    const docSnap = await docRef.get();

    if (docSnap.exists) {
      const data = docSnap.data();

      // Nếu bạn chỉ muốn export một field cụ thể
      const exportData = fieldName ? data[fieldName] : data;

      // Tạo file JSON
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      // Tạo link download
      const a = document.createElement("a");
      a.href = url;
      a.download = `${myDoc}.json`; // tên file tải về
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      console.log("Đã tải về:", exportData);
    } else {
      console.error(`Document "${myDoc}" không tồn tại trong "${myCollection}"`);
    }
  } catch (err) {
    console.error("Lỗi khi download document:", err);
  }
}

// Gắn sự kiện click cho nút
document.getElementById("down").addEventListener("click", async () => {
  // Bạn điền tên field muốn export, ví dụ "Quotes"
  await downloadDoc(myCollection, "Quotes", "Quotes");
});


</script>
