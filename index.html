<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<title>Upload Quotes JSON to Firestore</title>
	<!-- Firebase App (core) -->
	<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
	<!-- Firestore -->
	<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
	<h1>Upload Quotes JSON to Firestore</h1>
	<input type="file" id="uploadFile" accept=".json">
	<button id="uploadBtn">Upload to Firestore</button>

	<script>
		// TODO: Thay bằng config của project Firebase của bạn
const firebaseConfig = {
  apiKey: "AIzaSyCJEDi5fa69qTJ0iksDy8UeLS5Lw1wirgo",
  authDomain: "tieungaosinhan.firebaseapp.com",
  projectId: "tieungaosinhan",
  storageBucket: "tieungaosinhan.firebasestorage.app",
  messagingSenderId: "159414617772",
  appId: "1:159414617772:web:0a246068fdd8303a4c4109"
};


		// Init Firebase
		firebase.initializeApp(firebaseConfig);
		const db = firebase.firestore();

		document.getElementById("uploadBtn").onclick = async () => {
			const fileInput = document.getElementById("uploadFile");
			if (!fileInput.files.length) {
				alert("Chưa chọn file JSON!");
				return;
			}

			const file = fileInput.files[0];
			const text = await file.text();
			try {
				JSON.parse(text); // kiểm tra JSON hợp lệ
				await db.collection("files").doc("QuotesSet.json").set({ data: text });
				alert("✔ Upload thành công lên Firestore!");
			} catch (err) {
				alert("❌ File không phải JSON hợp lệ: " + err.message);
			}
		};
	</script>
</body>
</html>
