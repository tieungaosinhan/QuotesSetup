<body>

<div class="container">
	<div id = "original">
		<div id = "count"></div>
		<div id = "Q"></div>
	</div>
	<div class="action">
		<button id="apply">apply</button>
		<button id="del">del</button>
		<button id="down">down</button>
		<button id="btncount"></button>
		<button id = "check">-</button>
	</div>
	<div id="meaning">
		<textarea placeholder="Meaning" cols="3"></textarea>
	</div>
	<div id="card" class="tagbox"></div>
	<div id = "tags">
		<div class="tagbox">
			<div id="unique"></div>
			<div id="unique-meaning"></div>
		</div>
	</div>
	<div id = "review"></div>
	<div id ="pop" class="none"></div>
</div>

<script src="js/Q1.js"></script>
<script src="js/NewTags.js"></script>
<script src="js/template.js"></script>
<script>

	// Initialize Firebase
	const app = initializeApp(firebaseConfig);
	// Khởi tạo Firebase
	const db = getFirestore(app);
	// Gắn db vào window để main.js dùng được
	window.db = db;
	
	let Qobject, oQ, nQ, Quotesleft, Qi;
	let Card, TCard, TGroup;
	let CloneEls, ActiveEls, CardEls;
	let CloneObj = {}, ActiveObj = {}, CardObj = {};		
	let CloneArr = [], ActiveArr = [], ActiveCard = [];


	document.getElementById("del").addEventListener("click", () => {		
		const QuotesSets = db.collection("QuotesSets");
		QuotesSets.doc("oldpart0").update({ // Cập nhật document "oldpart0"
			oldpart0: firebase.firestore.FieldValue.arrayRemove(oQ[Qi]) // xóa phần tử tại vị trí Qi
		});
		reload();
	});	
	document.getElementById("down").onclick = async () => {
		const QuotesSets = db.collection("QuotesSets");

		try {
			// Lấy document newQ
			const newQDoc = await QuotesSets.doc("newQ").get();
			const nQ = newQDoc.exists ? newQDoc.data().newQ : [];

			// Lấy document oldpart0
			const oldQDoc = await QuotesSets.doc("oldpart0").get();
			const oQ = oldQDoc.exists ? oldQDoc.data().oldpart0 : [];

			// Lấy document Tags
			const tagDoc = await QuotesSets.doc("Tags").get();
			let TGroup = [], TCard = [], Card = [];
			if (tagDoc.exists) {
				TGroup = tagDoc.data().TagGroup || [];
				TCard = tagDoc.data().TagCard || [];
				Card = tagDoc.data().CardTag || [];
			}

			// Gom dữ liệu thành object
			const Data = {
				oldQ: oQ,
				newQ: nQ,
				TagGroup: TGroup,
				TagCard: TCard,
				CardTag: Card
			};

			// Xuất ra file JSON
			const blob = new Blob([JSON.stringify(Data, null, 2)], { type: "application/json" });
			const url = URL.createObjectURL(blob);
			const a = document.createElement("a");
			a.href = url;
			a.download = "QuotesSet.json";
			a.click();
			URL.revokeObjectURL(url);

		} catch (err) {
			console.error("Lỗi khi lấy dữ liệu từ Firestore:", err);
			alert("Không thể lấy dữ liệu từ Firestore!");
		}
	};

	document.getElementById("apply").onclick = () => {
		const meaning = document.querySelector(`#meaning textarea`).value;
		const tagEl = document.querySelectorAll("#card .active");
		const ArrEl = [];
		tagEl.forEach(el => {
			ArrEl.push(el.id);
		});
		if (ArrEl.length === 0 || meaning === "") {
			alert("Thiếu Data");
			return;
		}
		const block = makeBlock(oQ[Qi].quotes,meaning,oQ[Qi].author,ArrEl);
		const QuotesSets = db.collection("QuotesSets");
		QuotesSets.doc("newQ").update({ // Cập nhật document "newQ"
			newQ: firebase.firestore.FieldValue.arrayUnion(block) // thêm phần tử mới vào mảng newQ
		});
		QuotesSets.doc("oldpart0").update({ // Cập nhật document "oldpart0"
			oldpart0: firebase.firestore.FieldValue.arrayRemove(oQ[Qi]) // xóa phần tử tại vị trí Qi
		});
		reload();
	};	
	function makeBlock(En, Vi, Author, Tags) {
		// Tạo object block
		return {
			En,
			Vi,
			Author,
			Tags
		};
	}	
	


	function reload(){		
		const QuotesSets = db.collection("QuotesSets");
		const newQRef = QuotesSets.doc("newQ");
		newQRef.get().then((doc) => {
			nQ = doc.data().newQ;
		});
		const oldQRef = QuotesSets.doc("oldpart0");
		oldQRef.get().then((doc) => {
			oQ = doc.data().oldpart0;
		});
		const TagRef = QuotesSets.doc("Tags");
		TagRef.get().then((doc) => {
			TGroup = doc.data().TagGroup;
			TCard = doc.data().TagCard;
			Card = doc.data().CardTag;
		});

		let nQarr=[];
		let arr = [];
		nQ.forEach(el => {
			el.Tags.forEach(add => {
				arr.push(add);
			});
		});
		let countCard = {};
		let countArr = [];
		Object.keys(Card).forEach(C => {
			const count = arr.filter(tag => tag === C).length;
			countCard[C] = count;
			if (count === 0) {
				countArr.push(C);
			}
		});
		document.getElementById("btncount").innerHTML = countArr.length;//Số lượng 
		document.getElementById("btncount").onclick = () => {
			document.getElementById("pop").classList.toggle("none");
			document.getElementById("pop").innerHTML = "";
			countArr.forEach(C =>{
				console.log(Card[C].Name);
				let html = `<div>${Card[C].Name}</div>`;
				document.getElementById("pop").innerHTML += html;
			});
		};		
		
		Quotesleft = oQ.length;
		Qi = Math.floor(Math.random() * oQ.length);			
		document.getElementById("count").innerHTML = `Còn ${Quotesleft} quotes nè	=)) Chaiyoooo`;
		document.getElementById("Q").innerHTML = `${oQ[Qi].quotes} - ${oQ[Qi].author}`;
		document.querySelectorAll("#unique .tag").forEach(t=>{
			t.classList.remove("active");
		});
		document.getElementById("card").innerHTML = ``;
		document.querySelector(`#meaning textarea`).value = "";
		CloneObj = {};
		ActiveObj = {};
		CardObj = {};		
		CloneArr = [];
		ActiveArr = [];
		ActiveCard = [];		
	}
	
	reload();
	
	Object.keys(TGroup).forEach(G => {
		document.getElementById("unique").innerHTML += `<div class="tag" id=${G}>${TGroup[G].Name}</div>`;
		document.getElementById(`${G}`).title = TGroup[G].Title;
	});
	Activecolor(`#unique .tag`);
	document.querySelectorAll("#unique .tag").forEach(t=>{
		t.addEventListener("click", ut => {
			if (t.classList.contains(`active`)){
				if(document.querySelectorAll("#unique .active").length === 1) return;
				t.classList.remove(`active`);
				updateCardbox();
			} else{
				t.classList.add(`active`);
				updateCardbox();
			};
			
		});
	});
	
	document.querySelector("#card").addEventListener("click", e => {
		// chỉ xử lý khi click trúng phần tử con có class "tag"
		if (e.target.classList.contains("tag")) {
			const el = e.target;
			if (el.classList.contains("active")) {
				el.classList.remove("active");
			} else {
				el.classList.add("active");
			}
		}
	});	
	document.querySelector("#check").addEventListener("click", e => {
		e.target.innerHTML = e.target.innerHTML === "-" ? "+" : "-";
		if (ActiveArr.length === 0) return;
		updateCardbox();
	});	
	function updateCardbox(){
		CardEls = ActiveEls = document.querySelectorAll("#card .tag");
		CardIds = [...CardEls].map(el => el.id);
		ActiveEls = document.querySelectorAll("#unique .active");
		ActiveArr = [...ActiveEls].map(el => el.id); // Setup OK, min length = 1
		let tempArr = [];
		if (document.getElementById("check").innerHTML === "-"){ //Giao
			Object.keys(Card).forEach(card => {
				if (ActiveArr.every(el => Card[card].Groups.includes(el)) === true) {
					if (!tempArr.includes(card)) {
						tempArr.push(card);
					}			
				};
			});
		} else { //Hợp
			Object.keys(Card).forEach(card => {
				if (ActiveArr.some(el => Card[card].Groups.includes(el)) === true) {
					if (!tempArr.includes(card)) {
						tempArr.push(card);
					}			
				};
			});
		};
		
		if (CardIds.length === 0){
			tempArr.forEach(id => {
				let html = `<div class="tag" id="${id}">${Card[id].Name}</div>`;
				document.getElementById("card").innerHTML += html;
				document.getElementById(`${id}`).title = Card[id].Tags;
			});
		} else {
			const add = tempArr.filter(el => !CardIds.includes(el)).sort();;
			const remove = CardIds.filter(el => !tempArr.includes(el)).sort();;
			if(add.length !== 0) {
				add.forEach(id => {
					let html = `<div class="tag" id="${id}">${Card[id].Name}</div>`;
					document.getElementById("card").innerHTML += html;
					document.getElementById(`${id}`).title = Card[id].Tags;
				});				
			};
			if(remove.length !== 0) {
				remove.forEach(id => {
					document.getElementById(`${id}`).remove();
				});		
			};
		};
		document.getElementById("review").innerHTML = ``;
		Activecolor(`#card .tag`);
		CardEls = ActiveEls = document.querySelectorAll("#card .tag");
		CardIds = [...CardEls].map(el => el.id);
		CardIds.forEach(id => {
			let html = `<div class="result-line" id = "result-${id}"><div class="result">${Card[id].Name}</div><div class="mean">`;
			Card[id].Tags.forEach(tag => {
				html += `<div	id=${tag}>${TCard[tag].Title} </div>`;
			});
			html += `</div></div>`;
			document.getElementById("review").innerHTML += html;
		});
		Activecolor(`.result-line`);
	};

</script>
