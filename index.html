<body>

<div class="container">
	<div class="sidebar">
		<div></div>
		<div class="active"></div>
	</div>
	<div class = "suggestbox">
		<div id="cardbox"></div>

			<div id="btncount"></div>

	<div class="resultbox">

			<button id="reload">RELOAD</button>
			<button id="add">ADD</button>
			<button id="apply">APPLY</button>
			<button id="down"">DOWN</button>
		</div>
		<div class="Qbox">
			<div id = "Q"></div>

<script type="module">

	// Initialize Firebase
	firebase.initializeApp(firebaseConfig);
	const db = firebase.firestore();
	window.db = db;
	
	let Qobject, oQ, nQ, Quotesleft, Qi;
	let Card, TCard, TGroup;
	let TempCardArr,TempTCard, TempTGroup, TempoQ, TempnQ;
	let CloneEls, ActiveEls, CardEls, CardIds, ActiveIds;
	let CloneObj = {}, ActiveObj = {}, CardObj = {};		
	let CloneArr = [], ActiveArr = [], ActiveCard = [];
	let TagArr = [], GroupArr = [];


	document.getElementById("del").addEventListener("click", () => {		
		const QuotesSets = db.collection("QuotesSets");
		oQ.splice(Qi, 1);
		QuotesSets.doc("oldpart0").set({
			oldQ: JSON.stringify(oQ)
		});
		reload();
	});	
	async function downloadQuotesSets() {
		const QuotesSets = db.collection("QuotesSets");

		// Lấy từng document
		const docTags = await QuotesSets.doc("Tags").get();
		const docNewQ = await QuotesSets.doc("newQ").get();
		const docOldQ = await QuotesSets.doc("oldpart0").get();

		// Chuẩn bị dữ liệu
		const exportData = {};

		if (docTags.exists) {
			exportData.Tags = docTags.data();
		}
		if (docNewQ.exists) {
			// Nếu bạn lưu dưới dạng chuỗi JSON thì parse lại
			exportData.newQ = JSON.parse(docNewQ.data().newQ);
		}
		if (docOldQ.exists) {
			exportData.oldQ = JSON.parse(docOldQ.data().oldQ);
		}

		// Chuyển thành chuỗi JSON đẹp
		const jsonStr = JSON.stringify(exportData, null, 2);

		// Tạo blob và link download
		const blob = new Blob([jsonStr], { type: "application/json" });
		const url = URL.createObjectURL(blob);

		const a = document.createElement("a");
		a.href = url;
		a.download = "QuotesSets.json"; // tên file tải về
		a.click();

		URL.revokeObjectURL(url);
	};
	document.getElementById("down").onclick = () => {downloadQuotesSets();};
	document.getElementById("apply").onclick = () => {
		const meaning = document.querySelector(`#meaning`).value;
		const tagEl = document.querySelectorAll("#card .tag");
		const ArrEl = [];
		tagEl.forEach(el => {
			ArrEl.push(el.id);
		});
		if (ArrEl.length === 0 || meaning === "") {
			alert("Thiếu Data");
			return;
		}
		const block = makeBlock(oQ[Qi].quotes,meaning,oQ[Qi].author,ArrEl);
		nQ.push(block); // thêm block vào nQ của code
		oQ.splice(Qi, 1); // bỏ phần tử i ra khỏi oQ
		const QuotesSets = db.collection("QuotesSets");
		QuotesSets.doc("newQ").set({ // Ở QuotesSets, vào doc tên là new Q
			newQ: JSON.stringify(nQ) // ghi đè lên đó
		});
		QuotesSets.doc("oldpart0").set({ //Ở QuotesSets, vào doc tên là oldQ
			oldQ: JSON.stringify(oQ)
		});
		reload();
	};	
	document.getElementById("add").onclick = () => {
		document.getElementById("del").classList.add("none");
		document.getElementById("Q").innerHTML = `<textarea placeholder="Nhập quote mới"></textarea><br><span><input placeholder="Tên tác giả"><button class="quoteAdd">OK</button></span>`;
	};
	
	document.querySelector("#Q").addEventListener("click", e => {
		// chỉ xử lý khi click trúng phần tử con có class "tag"
		if (e.target.classList.contains("quoteAdd")) {
			console.log("old:",Qi);
			console.log("old:",oQ[Qi]);
			let tempq = document.querySelector("#Q textarea").value;
			let tempa = document.querySelector("#Q input").value;
			if (tempq === "" || tempa === "") {
				alert("Null")
				return;
			};
			let tempblock = makeAddBlock(tempq,tempa);
			Qi = Quotesleft;
			oQ.push(tempblock);
			console.log("new:",Qi);
			console.log("new:",oQ[Qi]);
			const QuotesSets = db.collection("QuotesSets");
			QuotesSets.doc("oldpart0").set({ //Ở QuotesSets, vào doc tên là oldQ
				oldQ: JSON.stringify(oQ)
			});
			document.getElementById("Q").innerHTML = `${oQ[Qi].quotes}<br><span>${oQ[Qi].author}</span>`;
			document.getElementById("del").classList.remove("none");
		}
	});		
	function makeBlock(En, Vi, Author, Tags) {
		// Tạo object block
		return {
			En,
			Vi,
			Author,
			Tags
		};
	}	
	function makeAddBlock(quotes, author) {
		// Tạo object block
		return {
			quotes,
			author
		};
	}	
	
	Activecolor(`.resultbox *`);
	Activecolor(`.sidebar *`);

	async function load() {
		const QuotesSets = db.collection("QuotesSets");

		const newQRef = QuotesSets.doc("newQ");
		const docN = await newQRef.get();
		if (docN.exists) TempnQ = docN.data().newQ;

		const oldQRef = QuotesSets.doc("oldpart0");
		const docO = await oldQRef.get();
		if (docO.exists) TempoQ = docO.data().oldQ;
		const docT = await QuotesSets.doc("Tags").get();
		if (docT.exists) {
			const data = docT.data();
			TempTGroup = data.TagGroup;
			TempTCard	= data.TagCard;
			TempCardArr = data.CardTag;
		}
		nQ = JSON.parse(TempnQ);
		oQ = JSON.parse(TempoQ);
		TGroup = JSON.parse(TempTGroup);
		TCard = JSON.parse(TempTCard);
		Card = JSON.parse(TempCardArr);
	}
	// Gọi load() một lần khi trang khởi động
	await load();


	function reload(){
		let nQarr=[];
		let arr = [];
		nQ.forEach(el => {
			el.Tags.forEach(add => {
				arr.push(add);
			});
		});
		let countCard = {};
		let countArr = [...new Set(arr)].sort();
		Object.keys(Card).forEach(C => {
			let count = 0;
			countArr.forEach(a => {
				if (a === C) {
					count ++;
				};
				countCard[C] = count;
			});
		});
		document.getElementById("btncount").innerHTML = countArr.length;//Số lượng 
		document.getElementById("btncount").onclick = () => {
			const tempElement = document.querySelectorAll("#cardbox .tag");
			// Thêm class .temp
			tempElement.forEach( el => {
				countArr.forEach(e => {
					if (e == el.id) el.classList.add("temp");
				});
				// Sau 1 phút thì gỡ class .temp
				setTimeout(() => {
					el.classList.remove("temp");
				}, 30000); // 30000 ms = 0.5 phút
			});
		};		
		Quotesleft = oQ.length;
		Qi = Math.floor(Math.random() * oQ.length);	
		document.getElementById("count").innerHTML = `Còn <span style="color:brown; font-weight:bold;">${Quotesleft}</span> quotes nè =)) Chaiyoooo`;
		document.getElementById("Q").innerHTML = `${oQ[Qi].quotes}<br><span>${oQ[Qi].author}</span>`;
		document.querySelectorAll("#unique .tag").forEach(t=>{
			t.classList.remove("active");
		});
		document.getElementById("card").innerHTML = ``;
		document.getElementById("cardtag").innerHTML = ``;
		document.querySelector(`#meaning`).value = "";
		CloneObj = {};
		CloneArr = [];
		ActiveObj = {};
		ActiveArr = [];
		CardObj = {};		
		ActiveCard = [];	
		ChunkCardbox()
	}
	reload();
	function ChunkCardbox() {
		setTimeout(() => {
			const keys = Object.keys(Card);
			let i = 0;
			const step = 1; // mỗi lần render 20 div

			function renderChunk() {
				const box = document.getElementById("cardbox");
				for (let j = 0; j < step && i < keys.length; j++, i++) {
					const card = keys[i];
					box.innerHTML += `<div class="tag" id="${card}">${Card[card].Name}</div>`;
				}
				if (i < keys.length) {
					setTimeout(renderChunk, 50); // tiếp tục sau 50ms
				}
				if (i < keys.length) {
    				setTimeout(renderChunk, 50);
   				} else {
    				Activecolor("#cardbox .tag");
				}
			};
			renderChunk();
		}, 500);
		Activecolor(`#cardbox .tag`);
	}	
	
	Object.keys(TGroup).forEach(group => {
		document.getElementById("group").innerHTML += `<div class="keytag" id="${group}">#${group}</div>`;
	});
	Activecolor(`.keytag`);

	document.getElementById("reload").onclick = () => {reload();};
	document.querySelector(".sidebar div").addEventListener("click", e => {
		document.querySelectorAll(".sidebar div").forEach(div => {
			div.classList.toggle("active");
		});
		document.querySelector(".container").classList.toggle("push");
	});

	document.querySelector("#cardbox").addEventListener("click", e => {
		// chỉ xử lý khi click trúng phần tử con có class "tag"
		if (e.target.classList.contains("tag")) {
			const t = e.target;
			let tempid = t.id;
			ActiveObj = document.querySelectorAll("#card .tag");
			ActiveArr = [...ActiveObj].map(el => el.id);
			ActiveArr.push(tempid);
			ActiveArr.sort();
			let html = ``;
			ActiveArr.forEach(id => {
				html += `<div class="tag active" id="${id}">${Card[id].Name}</div>`;
				Card[id].Tags.forEach(tag => {
					Object.keys(TCard).forEach(e => {
						if (e === tag) document.getElementById("cardtag").innerHTML += `<div class="keytag ${id} active">${TCard[tag].Title}</div>`;
					});
				});
			})
			document.querySelector("#card").innerHTML = html;
			t.remove();
			Activecolor(`#card .tag`);
			document.querySelectorAll("#card .tag").forEach(el => {
				let id = el.id;
				const activeColor = getComputedStyle(el).getPropertyValue("--active-color");
				document.querySelectorAll("#cardtag .keytag").forEach(e => {
					if (e.classList.contains(id)) e.style.setProperty("--active-color", activeColor);
				});
			});
			document.querySelectorAll(".keytag").forEach(el => {
				Object.keys(Card).forEach(c =>{
					if (el.classList.contains(c)) el.title = Card[c].Name;
				});
			});
		}
	});	
	document.querySelector("#card").addEventListener("click", e => {
		// chỉ xử lý khi click trúng phần tử con có class "tag"
		if (e.target.classList.contains("tag")) {
			const t = e.target;
			let tempid = t.id;
			CloneObj = document.querySelectorAll("#cardbox .tag");
			CloneArr = [...CloneObj].map(el => el.id);
			CloneArr.push(tempid);
			CloneArr = [...new Set(CloneArr)];
			CloneArr.sort();
			let html = ``;
			CloneArr.forEach(id => {
				html += `<div class="tag" id="${id}">${Card[id].Name}</div>`;
			})
			document.querySelector("#cardbox").innerHTML = html;
			t.remove();
			Activecolor(`#cardbox .tag`);
			document.querySelectorAll(`.${t.id}`).forEach(el => {
				el.remove();
			});
			let currentCardObj = document.querySelectorAll("#cardbox .tag");
			currentCardObj.forEach(el => {
				el.classList.remove("none");
			});
			let currentGroupObj = document.querySelectorAll("#group .keytag");
			currentGroupObj.forEach(el => {
				el.classList.remove("active");
			});
		}
	});	
	document.querySelector("#group").addEventListener("click", e => {
		// chỉ xử lý khi click trúng phần tử con có class "tag"
		if (e.target.classList.contains("keytag")) { 
			let currentCardObj = document.querySelectorAll("#cardbox .tag");
			currentCardObj.forEach(el => {
				el.classList.remove("none");
			});
			let currentCardArr = [...currentCardObj].map(el => el.id);
			let chooseArr = [];
			const t = e.target;
			let tempid = t.id;
			t.classList.toggle("active");
			let chooseObj = document.querySelectorAll(`#group .active`);
			chooseObj.forEach(el => {
				let id = el.id;
				chooseArr.push(id);
			});
			let hidden = [];
			currentCardArr.forEach(c =>{
				if (chooseArr.every(el => Card[c].Groups.includes(el)) === false) hidden.push(c);
			});
			currentCardObj.forEach(el => {
				let id = el.id;
				if (hidden.includes(id)) el.classList.add("none");
			});
		}
	});

</script>
